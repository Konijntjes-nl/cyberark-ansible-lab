---
- name: Map custom IP variable to ansible_host
  hosts: vault
  gather_facts: false
  tasks:
    - name: Set ansible_host for WinRM connections
      set_fact:
        ansible_host: "{{ ip }}"

# ======================================================================
# DEPLOY PRIMARY VAULT
# ======================================================================
- name: Deploy CyberArk Primary Vault
  hosts: vault-01
  gather_facts: yes
  pre_tasks:
    - name: "Get CD-ROM Drive Letter"
      ansible.windows.win_shell:
        cmd: |
          (Get-Volume | Where-Object { $_.DriveType -eq 'CD-ROM' -and $_.FileSystemLabel -notmatch 'cidata' -and $_.FileSystemLabel -ne $null } | Select-Object -First 1).DriveLetter
      register: cdrom
      changed_when: false
      
    - name: "Set ISO Path Fact"
      set_fact:
        iso_drive: "{{ cdrom.stdout | trim }}:\\"

    - name: "Create default packages directory"
      ansible.windows.win_file:
        path: "C:\\Cyberark\\packages\\Vault"
        state: directory

    - name: "Stage Vault files from read-only ISO to local disk"
      ansible.windows.win_copy:
        # Note: Verify the exact folder name on your ISO. It is usually "PrivateArk Server" or "Server"
        src: "{{ iso_drive }}PrivateArk Server\\" 
        dest: "C:\\Cyberark\\packages\\Vault\\"
        remote_src: yes

    - name: "Remove Read-Only attribute from staged files"
      ansible.windows.win_shell: |
        Get-ChildItem -Path "C:\Cyberark\packages\Vault" -Recurse | Where-Object { $_.IsReadOnly } | ForEach-Object { $_.IsReadOnly = $false }

  roles:
    - role: vault
      vars:
        # Disable file extraction since we staged them manually
        vault_extract: false
        vault_ignore_checksum: true
        
        # Enable installation phases
        vault_prerequisites: true
        vault_install: true
        vault_postinstall: true
        vault_hardening: true
        
        # Architecture configuration
        is_primary_vault: true
        
        # Installation Paths
        vault_installation_folder: "C:\\Cyberark\\packages\\Vault\\Server-Rls-v15.2"
        vault_installation_automation_folder: "C:\\Cyberark\\packages\\Vault\\Server-Rls-v15.2\\InstallationAutomation"
        
        # Passwords (Ideally pull these from your vault_lab_password variable)
        vault_admin_password: "YourStrongAdminPassword123!"
        vault_master_password: "YourStrongMasterPassword123!"