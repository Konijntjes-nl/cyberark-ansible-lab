---
# ======================================================================
# PLAY 1: Generate Certificates on CA
# ======================================================================
- name: "Generate Certificates on CA"
  hosts: dc-01
  gather_facts: no
  vars:
    export_path: "C:\\CyberArk_Certs"
    local_cert_dir: "/opt/certs"
    pfx_password: "{{ lab_password }}"
    domain: "lab.cybermark.tech"
  tasks:
    - name: "Ensure Local Certs Directory Exists on Ansible Control Node"
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ local_cert_dir }}"
        state: directory
        mode: '0755'

    - name: "Ensure Export Directory Exists"
      ansible.windows.win_file:
        path: "{{ export_path }}"
        state: directory

    - name: "Export Root CA and Convert to PEM"
      ansible.windows.win_shell:
        cmd: |
          $ExportPath = '{{ export_path }}'
          Remove-Item -Path "$ExportPath\RootCA.cer" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$ExportPath\RootCA.pem" -Force -ErrorAction SilentlyContinue
          
          $RootCert = Get-ChildItem Cert:\LocalMachine\Root, Cert:\LocalMachine\My, Cert:\LocalMachine\CA | 
                      Where-Object { $_.Subject -match "cybermark" -or $_.Subject -match "lab" } | 
                      Select-Object -First 1
          
          if (-not $RootCert) { exit 1 }
          
          $Bytes = $RootCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes("$ExportPath\RootCA.cer", $Bytes)
          certutil -f -encode "$ExportPath\RootCA.cer" "$ExportPath\RootCA.pem" | Out-Null

    - name: "Publish Template and Restart CA Service"
      ansible.windows.win_shell:
        cmd: |
          certutil -setcatemplates +CyberArkWebServer
          Restart-Service certsvc
          Start-Sleep -Seconds 5

    - name: "Generate SAN Certificates and Export to PFX"
      ansible.windows.win_shell:
        cmd: |
          $Password = ConvertTo-SecureString -String '{{ pfx_password }}' -Force -AsPlainText
          $ExportPath = '{{ export_path }}'
          
          $CaName = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration" -Name "Active" -ErrorAction SilentlyContinue).Active
          if (-not $CaName) {
              $CaName = (Get-ChildItem -Path "HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty PSChildName -First 1)
          }
          if (-not $CaName) { exit 1 }
          $CaConfig = "$($env:COMPUTERNAME)\$CaName"
          
          $Certificates = @(
              @{ 
                  Name="PVWA"
                  Subject="CN=pvwa.{{ domain }}"
                  SANs=@("pvwa.{{ domain }}", "pvwa-01.{{ domain }}", "pvwa-02.{{ domain }}", "pvwa", "pvwa-01", "pvwa-02") 
              },
              @{ 
                  Name="PSM"
                  Subject="CN=psm.{{ domain }}"
                  SANs=@("psm.{{ domain }}", "psm-01.{{ domain }}", "psm-02.{{ domain }}", "psm", "psm-01", "psm-02") 
              },
              @{ 
                  Name="Vault"
                  Subject="CN=vault.{{ domain }}"
                  SANs=@("vault.{{ domain }}", "vault-01.{{ domain }}", "vault-02.{{ domain }}", "vault", "vault-01", "vault-02") 
              },
              @{ 
                  Name="HTML5GW"
                  Subject="CN=htmlgw.{{ domain }}"
                  SANs=@("htmlgw.{{ domain }}", "htmlgw-01.{{ domain }}", "htmlgw-02.{{ domain }}", "htmlgw", "htmlgw-01", "htmlgw-02") 
              },
              @{ 
                  Name="LB"
                  Subject="CN=lb.{{ domain }}"
                  SANs=@("lb.{{ domain }}", "lb-01.{{ domain }}", "lb-02.{{ domain }}", "lb", "lb-01", "lb-02") 
              }
          )
          
          foreach ($cert in $Certificates) {
              $PfxPath = Join-Path $ExportPath "$($cert.Name).pfx"
              if (-not (Test-Path $PfxPath)) {
                  $InfPath = "$ExportPath\$($cert.Name).inf"
                  $ReqPath = "$ExportPath\$($cert.Name).req"
                  $CerPath = "$ExportPath\$($cert.Name).cer"
                  
                  $SanString = ($cert.SANs | ForEach-Object { "dns=$_" }) -join "&"
                  $InfContent = @"
          [Version]
          Signature= "`$Windows NT`$"
          [NewRequest]
          Subject = "$($cert.Subject)"
          KeyLength = 4096
          KeySpec = 1
          KeyUsage = 0xA0
          MachineKeySet = True
          Exportable = True
          ProviderName = "Microsoft RSA SChannel Cryptographic Provider"
          ProviderType = 12
          RequestType = PKCS10
          [Extensions]
          2.5.29.17 = "{text}$SanString"
          "@
                  Set-Content -Path $InfPath -Value $InfContent -Encoding ASCII
                  
                  & certreq.exe -new -q -f "$InfPath" "$ReqPath"
                  & certreq.exe -submit -q -f -attrib "CertificateTemplate:CyberArkWebServer" -config "$CaConfig" "$ReqPath" "$CerPath"
                  & certreq.exe -accept -machine -q -f "$CerPath"
                  
                  # Fixed Matching Logic: Escapes the dot characters in the exact Subject string
                  $MatchSubject = $cert.Subject -replace '\.', '\.'
                  $InstalledCert = Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.Subject -match $MatchSubject } | Sort-Object NotBefore -Descending | Select-Object -First 1
                  if ($InstalledCert) {
                      Export-PfxCertificate -Cert $InstalledCert -FilePath $PfxPath -Password $Password | Out-Null
                  }
                  Remove-Item $InfPath, $ReqPath, $CerPath -Force -ErrorAction SilentlyContinue
              }
          }

    - name: "Fetch Certificates to Ansible Control Node (/opt/certs)"
      ansible.builtin.fetch:
        src: "{{ export_path }}\\{{ item }}"
        dest: "{{ local_cert_dir }}/"
        flat: yes
      loop:
        - PVWA.pfx
        - PSM.pfx
        - Vault.pfx
        - HTML5GW.pfx
        - LB.pfx
        - RootCA.cer
        - RootCA.pem

# ======================================================================
# PLAY 2: Stage Certificates on PVWA Nodes
# ======================================================================
- name: "Stage Certificates to PVWA"
  hosts: pvwa
  gather_facts: no
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure D:\\Certs Directory Exists"
      ansible.windows.win_file:
        path: "D:\\Certs"
        state: directory

    - name: "Push Certificates to PVWA D:\\Certs"
      ansible.windows.win_copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "D:\\Certs\\{{ item }}"
      loop:
        - RootCA.cer
        - PVWA.pfx

    - name: "Import Root CA to Trusted Root Store"
      ansible.windows.win_certificate_store:
        path: "D:\\Certs\\RootCA.cer"
        store_location: LocalMachine
        store_name: Root
        state: present

    - name: "Get PVWA Certificate Thumbprint"
      ansible.windows.win_shell: |
        $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("D:\Certs\PVWA.pfx", "{{ lab_password }}")
        $cert.Thumbprint
      register: pvwa_thumbprint

    - name: "Import PVWA Certificate via Certutil"
      ansible.windows.win_shell: |
        certutil.exe -f -p "{{ lab_password }}" -importpfx My "D:\Certs\PVWA.pfx" NoRoot
      become: yes
      become_method: runas
      become_user: SYSTEM

    - name: "Automatically Bind IIS Certificate (If IIS is Installed)"
      ansible.windows.win_shell: |
        if (Get-Module -ListAvailable -Name WebAdministration) {
            Import-Module WebAdministration
            
            # 1. Clean up existing bindings in IIS
            if (Get-WebBinding -Name "Default Web Site" -Protocol https -ErrorAction SilentlyContinue) {
                Remove-WebBinding -Name "Default Web Site" -Protocol https
            }
            
            # 2. Create the new IIS binding block
            New-WebBinding -Name "Default Web Site" -Protocol https -Port 443 -IPAddress "*" -SslFlags 0
            
            # 3. Apply the certificate natively via HTTP.sys
            $Thumbprint = "{{ pvwa_thumbprint.stdout | trim }}"
            $AppId = "{4dc3e181-e14b-4a21-b022-59fc669b0914}" # Standard IIS AppId
            
            netsh http delete sslcert ipport=0.0.0.0:443 2>&1 | Out-Null
            
            $netshOutput = netsh http add sslcert ipport=0.0.0.0:443 certhash=$Thumbprint appid=$AppId certstorename=MY
            if ($LASTEXITCODE -ne 0) {
                throw "Netsh failed to bind certificate: $netshOutput"
            }
        }
      become: yes
      become_method: runas
      become_user: SYSTEM
      when: pvwa_thumbprint.stdout is defined

# ======================================================================
# PLAY 2.5: Stage Certificates on CPM Nodes
# ======================================================================
- name: "Stage Certificates to CPM"
  hosts: cpm
  gather_facts: no
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure D:\\Certs Directory Exists"
      ansible.windows.win_file:
        path: "D:\\Certs"
        state: directory

    - name: "Push Root CA to CPM D:\\Certs"
      ansible.windows.win_copy:
        src: "{{ local_cert_dir }}/RootCA.cer"
        dest: "D:\\Certs\\RootCA.cer"

    - name: "Import Root CA to Trusted Root Store"
      ansible.windows.win_certificate_store:
        path: "D:\\Certs\\RootCA.cer"
        store_location: LocalMachine
        store_name: Root
        state: present

# ======================================================================
# PLAY 3: Stage Certificates on PSM Nodes
# ======================================================================
- name: "Stage Certificates to PSM"
  hosts: psm
  gather_facts: no
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure D:\\Certs Directory Exists"
      ansible.windows.win_file:
        path: "D:\\Certs"
        state: directory

    - name: "Push Certificates to PSM D:\\Certs"
      ansible.windows.win_copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "D:\\Certs\\{{ item }}"
      loop:
        - RootCA.cer
        - PSM.pfx

    - name: "Import Root CA to Trusted Root Store"
      ansible.windows.win_certificate_store:
        path: "D:\\Certs\\RootCA.cer"
        store_location: LocalMachine
        store_name: Root
        state: present

    - name: "Get PSM Certificate Thumbprint"
      ansible.windows.win_shell: |
        $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("D:\Certs\PSM.pfx", "{{ lab_password }}")
        $cert.Thumbprint
      register: psm_thumbprint

    - name: "Import PSM Certificate via Certutil"
      ansible.windows.win_shell: |
        certutil.exe -f -p "{{ lab_password }}" -importpfx My "D:\Certs\PSM.pfx" NoRoot
      become: yes
      become_method: runas
      become_user: SYSTEM

    - name: "Automatically Bind RDS Certificate (If RDS is Installed)"
      ansible.windows.win_shell: |
        $Path = (Get-WmiObject -class "Win32_TSGeneralSetting" -Namespace root\cimv2\terminalservices -Filter "TerminalName='RDP-tcp'" -ErrorAction SilentlyContinue).__path
        if ($Path) {
            Set-WmiInstance -Path $Path -argument @{SSLCertificateSHA1Hash="{{ psm_thumbprint.stdout | trim }}"} | Out-Null
        }
      become: yes
      become_method: runas
      become_user: SYSTEM
      when: psm_thumbprint.stdout is defined

# ======================================================================
# PLAY 4: Stage Certificates on Vault Nodes
# ======================================================================
- name: "Stage Certificates to Vault"
  hosts: vault
  gather_facts: no
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure D:\\Certs Directory Exists"
      ansible.windows.win_file:
        path: "D:\\Certs"
        state: directory

    - name: "Push Certificates to Vault D:\\Certs"
      ansible.windows.win_copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "D:\\Certs\\{{ item }}"
      loop:
        - RootCA.cer
        - Vault.pfx

    - name: "Import Root CA to Trusted Root Store"
      ansible.windows.win_certificate_store:
        path: "D:\\Certs\\RootCA.cer"
        store_location: LocalMachine
        store_name: Root
        state: present

    - name: "Get Vault Certificate Thumbprint"
      ansible.windows.win_shell: |
        $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("D:\Certs\Vault.pfx", "{{ lab_password }}")
        $cert.Thumbprint
      register: vault_thumbprint

    - name: "Import Vault Certificate via Certutil"
      ansible.windows.win_shell: |
        certutil.exe -f -p "{{ lab_password }}" -importpfx My "D:\Certs\Vault.pfx" NoRoot
      become: yes
      become_method: runas
      become_user: SYSTEM

    - name: "Automatically Bind Vault TLS Certificate (If Vault is Installed)"
      ansible.windows.win_shell: |
        $CACertPath = "C:\Program Files (x86)\PrivateArk\Server\CACert.exe"
        if (Test-Path $CACertPath) {
            Start-Process -FilePath $CACertPath -ArgumentList "set server /process" -Wait -NoNewWindow
            Restart-Service "PrivateArk Server" -Force -ErrorAction SilentlyContinue
            Restart-Service "CyberArk Logic Container" -Force -ErrorAction SilentlyContinue
        }
      become: yes
      become_method: runas
      become_user: SYSTEM

# ======================================================================
# PLAY 5: Stage Certificates on HTML5 Gateway Nodes (Linux / Podman)
# ======================================================================
- name: "Stage Certificates to HTML5GW"
  hosts: htmlgw*
  gather_facts: no
  become: yes
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure /opt/certs Directory Exists"
      ansible.builtin.file:
        path: "/opt/certs"
        state: directory
        mode: '0755'

    - name: "Push Certificates to HTML5GW"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "/opt/certs/{{ item }}"
        mode: '0600'
      loop:
        - RootCA.pem
        - HTML5GW.pfx
        - PVWA.pfx

    - name: "Place Root CA in OS Trust Store"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/RootCA.pem"
        dest: "/etc/pki/ca-trust/source/anchors/RootCA.pem"
        mode: '0644'

    - name: "Update OS CA Trust"
      ansible.builtin.command: update-ca-trust

    - name: "Drop Podman PEM Conversion Script"
      ansible.builtin.copy:
        dest: "/opt/certs/1_Prepare_HTML5_Certs.sh"
        mode: '0700'
        content: |
          #!/bin/bash
          cd /opt/certs
          echo "Extracting Key and Certificate for Podman HTML5 container..."
          
          # Gateway Cert & Key
          openssl pkcs12 -in HTML5GW.pfx -nocerts -out html5gw.key -nodes -passin pass:{{ lab_password }}
          openssl pkcs12 -in HTML5GW.pfx -clcerts -nokeys -out html5gw.crt -passin pass:{{ lab_password }}
          
          # PVWA Cert for JWT validation
          openssl pkcs12 -in PVWA.pfx -clcerts -nokeys -out pvwa.crt -passin pass:{{ lab_password }}
          
          chmod 600 html5gw.key html5gw.crt pvwa.crt RootCA.pem
          
          echo "Done."
          echo "CRITICAL for Guacamole: You MUST mount these into the container:"
          echo "  -v /opt/certs/RootCA.pem:/etc/pki/ca-trust/source/anchors/RootCA.pem"
          echo "  -v /opt/certs/pvwa.crt:/etc/opt/CARKpsmgw/certs/pvwa.crt"

# ======================================================================
# PLAY 6: Stage Certificates on Load Balancer Nodes (Linux / HAProxy)
# ======================================================================
- name: "Stage Certificates to Load Balancers"
  hosts: lb*
  gather_facts: no
  become: yes
  vars:
    local_cert_dir: "/opt/certs"
  tasks:
    - name: "Ensure /opt/certs Directory Exists"
      ansible.builtin.file:
        path: "/opt/certs"
        state: directory
        mode: '0755'

    - name: "Push Certificates to Load Balancer"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "/opt/certs/{{ item }}"
        mode: '0600'
      loop:
        - RootCA.pem
        - LB.pfx
        - PVWA.pfx
        - PSM.pfx
        - HTML5GW.pfx

    - name: "Place Root CA in OS Trust Store"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/RootCA.pem"
        dest: "/etc/pki/ca-trust/source/anchors/RootCA.pem"
        mode: '0644'

    - name: "Update OS CA Trust"
      ansible.builtin.command: update-ca-trust

    - name: "Drop HAProxy PEM Conversion Script"
      ansible.builtin.copy:
        dest: "/opt/certs/1_Prepare_HAProxy_Certs.sh"
        mode: '0700'
        content: |
          #!/bin/bash
          cd /opt/certs
          echo "Extracting and combining certificates for HAProxy..."
          
          for cert in LB PVWA PSM HTML5GW; do
              if [ -f "${cert}.pfx" ]; then
                  # Convert to lowercase for cleaner filenames
                  lower_cert=$(echo "$cert" | tr '[:upper:]' '[:lower:]')
                  
                  openssl pkcs12 -in "${cert}.pfx" -nocerts -out "${lower_cert}.key" -nodes -passin pass:{{ lab_password }}
                  openssl pkcs12 -in "${cert}.pfx" -clcerts -nokeys -out "${lower_cert}.crt" -passin pass:{{ lab_password }}
                  cat "${lower_cert}.crt" "${lower_cert}.key" > "haproxy_${lower_cert}.pem"
              fi
          done
          
          chmod 600 *.pem *.key *.crt RootCA.pem
          
          echo "Done. Extracted HAProxy-ready PEMs for LB, PVWA, PSM, and HTML5GW."