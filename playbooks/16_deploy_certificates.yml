# ==============================================================================
# PLAY 6: Stage Certificates on HTML5 Gateway Nodes (Linux / Podman)
# ==============================================================================
- name: "Stage Certificates to HTML5GW"
  hosts: htmlgw*
  gather_facts: no
  become: yes
  vars:
    local_cert_dir: "/opt/certs"
    container_cert_dir: "/opt/cert"

  tasks:
    - name: "Ensure /opt/cert Directory Exists"
      ansible.builtin.file:
        path: "{{ container_cert_dir }}"
        state: directory
        mode: '0755'

    - name: "HTML5GW - Prepare Certificate Directory"
      ansible.builtin.file:
        path: /opt/cert
        state: directory
        mode: '0755'
        setype: container_file_t

    - name: "HTML5GW - Copy Certificates and Keys"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        setype: container_file_t
      loop:
        - { src: 'files/certs/html5gw.crt', dest: '/opt/cert/html5gw.crt', mode: '0644' }
        - { src: 'files/certs/html5gw.key', dest: '/opt/cert/html5gw.key', mode: '0600' }
        # Deploy Root CA as PEM format for OpenSSL compatibility inside the container
        - { src: 'files/certs/RootCA.pem', dest: '/opt/cert/RootCA.pem', mode: '0644' }
        - { src: 'files/certs/RootCA.pem', dest: '/opt/cert/psm-ca.pem', mode: '0644' }
        - { src: 'files/certs/RootCA.pem', dest: '/opt/cert/pvwa-ca.pem', mode: '0644' }

    - name: "Place Root CA in Host OS Trust Store"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/RootCA.pem"
        dest: "/etc/pki/ca-trust/source/anchors/RootCA.pem"
        mode: '0644'

    - name: "Update Host OS CA Trust"
      ansible.builtin.command: update-ca-trust

    - name: "Generate Strict Formats and Purge All PFX Bundles"
      ansible.builtin.shell:
        cmd: |
          set -e
          cd {{ container_cert_dir }}

          # 1. Strip Windows carriage returns
          sed -i 's/\r$//' *.pem *.cer 2>/dev/null || true

          # 2. Extract HTML5 Gateway Certificate & Private Key
          openssl pkcs12 -in HTML5GW.pfx -nocerts -out html5gw.key -nodes -passin pass:{{ lab_password }}
          openssl pkcs12 -in HTML5GW.pfx -clcerts -nokeys -out html5gw.crt -passin pass:{{ lab_password }}

          # 3. Clean Root CA copies
          cp RootCA.pem ca.pem
          cp RootCA.pem ca.crt

          # 4. PSM Signing CA formats
          cp RootCA.cer psm-ca.cer
          openssl x509 -in RootCA.pem -outform der -out psm-ca.der

          # 5. PVWA Signing CA formats
          cp RootCA.pem pvwa-ca.pem
          openssl x509 -in RootCA.pem -outform der -out pvwa-ca.der

          # 6. Extract Public component certificates
          openssl pkcs12 -in PVWA.pfx -clcerts -nokeys -out pvwa.crt -passin pass:{{ lab_password }}
          openssl pkcs12 -in PSM.pfx -clcerts -nokeys -out psm.crt -passin pass:{{ lab_password }}

          # 7. Normalize all PEM blocks
          for f in *.crt *.pem *.key; do
            [ -f "$f" ] && (openssl x509 -in "$f" -out "$f" 2>/dev/null || openssl rsa -in "$f" -out "$f" 2>/dev/null || true)
          done

          # 8. Delete all PFX bundles from /opt/cert
          rm -f *.pfx

          # 9. Set permissions
          chmod 600 *
          chmod 755 .
      args:
        executable: /bin/bash


# ==============================================================================
# PLAY 7: Stage Certificates on Load Balancer Nodes (Linux / HAProxy)
# ==============================================================================
- name: "Stage Certificates to Load Balancers"
  hosts: lb*
  gather_facts: no
  become: yes
  vars:
    local_cert_dir: "/opt/certs"

  tasks:
    - name: "Ensure /opt/certs Directory Exists"
      ansible.builtin.file:
        path: "/opt/certs"
        state: directory
        mode: '0755'

    - name: "Push Certificates to Load Balancer"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/{{ item }}"
        dest: "/opt/certs/{{ item }}"
        mode: '0600'
      loop:
        - RootCA.pem
        - LB.pfx
        - PVWA.pfx
        - PSM.pfx
        - HTML5GW.pfx

    - name: "Place Root CA in Host OS Trust Store"
      ansible.builtin.copy:
        src: "{{ local_cert_dir }}/RootCA.pem"
        dest: "/etc/pki/ca-trust/source/anchors/RootCA.pem"
        mode: '0644'

    - name: "Update Host OS CA Trust"
      ansible.builtin.command: update-ca-trust

    - name: "Combine Private Keys and Certificates for HAProxy"
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /opt/certs
          
          for cert in LB PVWA PSM HTML5GW; do
              if [ -f "${cert}.pfx" ]; then
                  lower_cert=$(echo "$cert" | tr '[:upper:]' '[:lower:]')
                  openssl pkcs12 -in "${cert}.pfx" -nocerts -out "${lower_cert}.key" -nodes -passin pass:{{ lab_password }}
                  openssl pkcs12 -in "${cert}.pfx" -clcerts -nokeys -out "${lower_cert}.crt" -passin pass:{{ lab_password }}
                  cat "${lower_cert}.crt" "${lower_cert}.key" > "haproxy_${lower_cert}.pem"
              fi
          done
          chmod 600 *.pem *.key *.crt
      args:
        executable: /bin/bash