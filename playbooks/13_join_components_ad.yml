---
- name: "Join CyberArk Component Servers to Active Directory"
  # Target only the Windows component servers, excluding the Vaults
  hosts: cpm, pvwa, psm
  gather_facts: yes

  tasks:
    - name: "Ensure DNS is pointed to Domain Controllers"
      ansible.windows.win_dns_client:
        adapter_names: "*"
        ipv4_addresses:
          - "10.0.3.1"
          - "10.0.3.2"
      
    - name: "Join Windows VMs to the {{ domain_name }} domain"
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ domain_netbios }}\\Administrator"
        domain_admin_password: "{{ lab_password }}"
        state: domain
      register: domain_join

    - name: "Reboot to apply domain membership"
      ansible.windows.win_reboot:
        msg: "Rebooting to finalize Active Directory join"
        reboot_timeout: 600
        post_reboot_delay: 30
      when: domain_join.reboot_required | default(false)

    - name: "Verify Domain Membership"
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_ComputerSystem).PartOfDomain
      register: domain_status
      changed_when: false

    - name: "Display Domain Status"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is joined to domain: {{ domain_status.stdout | trim }}"