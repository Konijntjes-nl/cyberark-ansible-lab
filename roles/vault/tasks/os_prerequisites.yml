---
# tasks file for os_prerequisites

- name: Find Data Drive letter by label
  ansible.windows.win_shell: (Get-Volume -FileSystemLabel "Data Drive").DriveLetter
  register: data_drive_letter_output

- name: Set the data drive letter as fact
  ansible.builtin.set_fact:
    data_drive_letter: "{{ data_drive_letter_output.stdout_lines[0] }}"

- name: Install Az Cmdlet
  ansible.windows.win_shell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
    Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
    Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
    Install-Module -Name Az
  when: platform == 'azure'
