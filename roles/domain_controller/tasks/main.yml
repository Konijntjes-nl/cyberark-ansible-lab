---
# ==========================================
# PRIMARY DC (DC-01) CONFIGURATION
# ==========================================
- name: "Install AD & DHCP Roles"
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DHCP
      - RSAT-AD-PowerShell
    include_management_tools: yes
    state: present
  register: ad_feature_install

# Always clear pending CBS state on dc-01 before forest creation
- name: "Reboot Primary DC before promotion"
  ansible.windows.win_reboot:
    msg: "Clearing pending reboot before AD forest promotion on dc-01"
    reboot_timeout: 600
  when: inventory_hostname == 'dc-01'

- name: "Promote Primary DC"
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ domain_netbios }}"
    safe_mode_password: "{{ safe_mode_password }}"
    install_dns: yes
  register: ad_promo_primary
  when: inventory_hostname == 'dc-01'

- name: "Reboot Primary DC if Promoted"
  ansible.windows.win_reboot:
    msg: "Rebooting after AD Promotion"
    post_reboot_delay: 180
  when: 
    - inventory_hostname == 'dc-01'
    - ad_promo_primary.reboot_required

- name: "Create Reverse DNS Zone"
  ansible.windows.win_shell: |
    $ZoneName = "3.0.10.in-addr.arpa"
    if (-not (Get-DnsServerZone -Name $ZoneName -ErrorAction SilentlyContinue)) {
        Add-DnsServerPrimaryZone -NetworkId "10.0.3.0/24" -ReplicationScope Forest
    }
  register: dns_create
  retries: 20
  delay: 30
  until: dns_create is success
  when: inventory_hostname == 'dc-01'

- name: "Authorize DHCP & Create Scope"
  ansible.windows.win_shell: |
    Add-DhcpServerInDC -DnsName "{{ inventory_hostname }}.{{ domain_name }}" -IPAddress {{ ansible_host }}
    
    if (-not (Get-DhcpServerv4Scope -ScopeId 10.0.3.0 -ErrorAction SilentlyContinue)) {
        Add-DhcpServerv4Scope -Name "LabScope" -StartRange 10.0.3.100 -EndRange 10.0.3.200 -SubnetMask 255.255.255.0 -State Active
        Set-DhcpServerv4OptionValue -ScopeId 10.0.3.0 -DnsDomain {{ domain_name }} -DnsServer {{ ansible_host }}
        Set-DhcpServerv4OptionValue -ScopeId 10.0.3.0 -Router {{ gateway }}
    }
  when: inventory_hostname == 'dc-01'

- name: "Import Reservations from Inventory"
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    $ScopeId = "10.0.3.0"
    $IP   = "{{ hostvars[item]['ip'] }}"
    $MAC  = "{{ hostvars[item]['mac'] }}".Replace(':', '-')
    $Name = "{{ item }}"
    $Zone = "{{ domain_name }}"
    $ReverseZone = "3.0.10.in-addr.arpa"

    # DHCP Reservation
    if (-not (Get-DhcpServerv4Reservation -IPAddress $IP -ErrorAction SilentlyContinue)) {
        Add-DhcpServerv4Reservation -ScopeId $ScopeId -IPAddress $IP -ClientId $MAC -Name $Name
    }

    # DNS A Record
    if (-not (Get-DnsServerResourceRecord -ZoneName $Zone -Name $Name -RRType A -ErrorAction SilentlyContinue)) {
        Add-DnsServerResourceRecordA -Name $Name -ZoneName $Zone -IPv4Address $IP
    }

    # DNS PTR Record
    $Octet = $IP.Split('.')[-1]
    if (-not (Get-DnsServerResourceRecord -ZoneName $ReverseZone -Name $Octet -RRType Ptr -ErrorAction SilentlyContinue)) {
        Add-DnsServerResourceRecordPtr -Name $Octet -ZoneName $ReverseZone -PtrDomainName "$Name.$Zone"
    }
  loop: "{{ groups['windows'] + groups['linux'] }}"
  when: 
    - inventory_hostname == 'dc-01'
    - hostvars[item]['ip'] is defined

- name: "Create CNAME Record for PKI HTTP CDP"
  ansible.windows.win_shell: |
    $Zone = "{{ domain_name }}"
    $Alias = "pki"
    $Target = "dc-01.$Zone"
    
    if (-not (Get-DnsServerResourceRecord -ZoneName $Zone -Name $Alias -RRType CName -ErrorAction SilentlyContinue)) {
        Add-DnsServerResourceRecordCName -Name $Alias -HostNameAlias $Target -ZoneName $Zone
    }
  when: inventory_hostname == 'dc-01'

- name: "Ensure DNS Forward A Records exist for VIPs"
  ansible.windows.win_shell: |
    $Zone = "{{ domain_name }}"
    $Name = "{{ item.name }}"
    $IP   = "{{ item.ip }}"

    if (Get-DnsServerResourceRecord -ZoneName $Zone -Name $Name -RRType CName -ErrorAction SilentlyContinue) {
        Remove-DnsServerResourceRecord -ZoneName $Zone -Name $Name -RRType CName -Force
    }

    $Existing = Get-DnsServerResourceRecord -ZoneName $Zone -Name $Name -RRType A -ErrorAction SilentlyContinue
    if (-not $Existing) {
        Add-DnsServerResourceRecordA -Name $Name -ZoneName $Zone -IPv4Address $IP
        Write-Output "Created A record for $Name -> $IP"
    } elseif ($Existing.RecordData.IPv4Address.IPAddressToString -ne $IP) {
        $NewRecord = $Existing.Clone()
        $NewRecord.RecordData.IPv4Address = [System.Net.IPAddress]::Parse($IP)
        Set-DnsServerResourceRecord -ZoneName $Zone -OldInputObject $Existing -NewInputObject $NewRecord
        Write-Output "Updated A record for $Name -> $IP"
    } else {
        Write-Output "A record for $Name already points to $IP"
    }
  loop:
    - { name: "pvwa", ip: "10.0.3.110" }
    - { name: "psm", ip: "10.0.3.120" }
    - { name: "htmlgw", ip: "10.0.3.130" }
    - { name: "ccp", ip: "10.0.3.140" }
    - { name: "conjur", ip: "10.0.3.150" }
  register: dns_vip_a_result
  changed_when: "'Created' in dns_vip_a_result.stdout or 'Updated' in dns_vip_a_result.stdout"
  when: inventory_hostname == 'dc-01'

- name: "Ensure DNS Reverse PTR Records exist for VIPs"
  ansible.windows.win_shell: |
    $RevZone = "3.0.10.in-addr.arpa"
    $IP      = "{{ item.ip }}"
    $Octet   = $IP.Split('.')[-1]
    $Target  = "{{ item.name }}.{{ domain_name }}"

    $ExistingPtr = Get-DnsServerResourceRecord -ZoneName $RevZone -Name $Octet -RRType Ptr -ErrorAction SilentlyContinue
    if (-not $ExistingPtr) {
        Add-DnsServerResourceRecordPtr -Name $Octet -ZoneName $RevZone -PtrDomainName $Target
        Write-Output "Created PTR record for $Octet -> $Target"
    } elseif ($ExistingPtr.RecordData.PtrDomainName.TrimEnd('.') -ne $Target) {
        $NewPtr = $ExistingPtr.Clone()
        $NewPtr.RecordData.PtrDomainName = "$Target."
        Set-DnsServerResourceRecord -ZoneName $RevZone -OldInputObject $ExistingPtr -NewInputObject $NewPtr
        Write-Output "Updated PTR record for $Octet -> $Target"
    } else {
        Write-Output "PTR record for $Octet already points to $Target"
    }
  loop:
    - { name: "pvwa", ip: "10.0.3.110" }
    - { name: "psm", ip: "10.0.3.120" }
    - { name: "htmlgw", ip: "10.0.3.130" }
    - { name: "ccp", ip: "10.0.3.140" }
    - { name: "conjur", ip: "10.0.3.150" }
  register: dns_vip_ptr_result
  changed_when: "'Created' in dns_vip_ptr_result.stdout or 'Updated' in dns_vip_ptr_result.stdout"
  when: inventory_hostname == 'dc-01'

# ==========================================
# SECONDARY DC (DC-02) CONFIGURATION
# ==========================================
# Always clear pending CBS state on dc-02 before promotion
- name: "Reboot Secondary DC before promotion"
  ansible.windows.win_reboot:
    msg: "Clearing pending reboot before DC promotion on dc-02"
    reboot_timeout: 600
  when: inventory_hostname == 'dc-02'

- name: "Point DNS to Primary DC"
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - "10.0.3.1"
  when: inventory_hostname == 'dc-02'

- name: "Wait for Domain DNS Resolution on Secondary DC"
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    Resolve-DnsName -Name "{{ domain_name }}" -Server 10.0.3.1
  register: dns_check
  retries: 15
  delay: 10
  until: dns_check is success
  when: inventory_hostname == 'dc-02'

- name: "Promote Secondary DC"
  microsoft.ad.domain_controller:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "{{ domain_admin_user }}"
    domain_admin_password: "{{ domain_admin_password }}"
    safe_mode_password: "{{ safe_mode_password }}"
    install_dns: yes
    state: domain_controller
  register: ad_promo_secondary
  when: inventory_hostname == 'dc-02'

- name: "Reboot Secondary DC if Promoted"
  ansible.windows.win_reboot:
    msg: "Rebooting Secondary DC"
    post_reboot_delay: 180
  when: 
    - inventory_hostname == 'dc-02'
    - ad_promo_secondary.reboot_required

- name: "DHCP Post-Install (Secondary)"
  ansible.windows.win_shell: |
    Add-DhcpServerSecurityGroup -ErrorAction SilentlyContinue
    Restart-Service dhcpserver
  when: inventory_hostname == 'dc-02'